name: Converter tests (ROM-free)
on:
  push:
    paths:
      - 'tools/sm64ds_convert.py'
      - 'tools/sm64ds_pipeline/**'
      - 'tests/**'
      - 'runtime/**'
      - 'src/viewer.c'
      - 'CMakeLists.txt'
      - '.github/workflows/converter-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python source syntax
        run: python3 -m compileall -q tools tests
      - name: ROM-free unit tests
        run: python3 -m unittest discover -s tests -v
